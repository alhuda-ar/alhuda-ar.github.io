<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
/* GitHub Pages SPA fallback: known routes are forwarded to index.html, which restores the clean URL. */
(function (l) {
  var p = l.pathname;
  var ok =
    /^\/(login|signup)\/?$/.test(p) ||
    /^\/studentprofile(\/(videos|books|exams|fees|schedule|courses(\/[1-9]\d{0,2})?))?\/?$/.test(p) ||
    /^\/admin-dash(\/content)?\/?$/.test(p) ||
    /^\/0[1-5]\/modal(\/(videos|books|courses(\/[1-9]\d{0,2})?))?\/?$/.test(p);
  if (ok) {
    document.documentElement.style.visibility = 'hidden';
    l.replace(
      l.protocol + '//' + l.host + '/?/' +
      p.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  }
})(window.location);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root{
    --bg-base:#1E3E38; --bg-alt:#17302B; --panel:rgba(250,246,236,0.05); --panel-border:rgba(250,246,236,0.14);
    --cream:#FAF6EC; --text-soft:#CBDAD3; --teal-300:#A9CFC6; --teal-500:#6FA69C; --gold:#D3A667;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Tajawal', sans-serif; color:var(--cream); text-align:center;
    background:
      radial-gradient(circle at 20% 15%, rgba(211,166,103,.16), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(169,207,198,.14), transparent 45%),
      linear-gradient(160deg,#25504a,var(--bg-base) 55%,var(--bg-alt));
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .box{ max-width:520px; width:100%; padding:44px 28px; border-radius:28px; background:var(--panel); border:1px solid var(--panel-border); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .brand{ display:inline-flex; align-items:center; gap:10px; font-weight:800; font-size:1.2rem; margin-bottom:26px; }
  .brand svg{ width:38px; height:38px; }
  .code{ font-size:clamp(5rem,22vw,8rem); font-weight:900; line-height:1; letter-spacing:.04em; background:linear-gradient(135deg,var(--gold),var(--teal-300)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1{ font-size:1.6rem; font-weight:800; margin:14px 0 10px; }
  p{ color:var(--text-soft); line-height:1.9; margin-bottom:28px; }
  .btn{ display:inline-flex; align-items:center; gap:8px; background:var(--cream); color:var(--bg-alt); text-decoration:none; font-weight:800; border-radius:999px; padding:14px 30px; transition:background .2s ease, transform .2s ease; }
  .btn:hover{ background:var(--gold); transform:translateY(-2px); }
  .btn:focus-visible{ outline:3px solid var(--teal-300); outline-offset:3px; }
</style>
</head>
<body>

    <a class="btn" href="/">الرجوع للرئيسية <span aria-hidden="true">←</span></a>
  </main>
