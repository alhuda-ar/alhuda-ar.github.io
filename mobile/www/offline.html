<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12281f"><title>الهدى</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,#1E3E38,#12281f 70%);color:#FAF6EC;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.c{max-width:340px}
.ic{width:96px;height:96px;margin:0 auto 22px;animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.w1,.w2,.w3{fill:none;stroke:#D3A667;stroke-width:5;stroke-linecap:round;animation:bl 1.8s infinite}
.w2{animation-delay:.25s;stroke:#E9C58B}.w3{animation-delay:.5s;stroke:#A9CFC6}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
h1{font-size:22px;margin:0 0 8px}p{margin:0 0 24px;color:#A9CFC6;line-height:1.8;font-size:15px}
button{background:linear-gradient(135deg,#E9C58B,#D3A667);color:#12281f;border:0;border-radius:14px;padding:13px 34px;font:700 16px inherit;font-family:inherit;cursor:pointer}
button:active{transform:scale(.97)}
</style></head><body><div class="c">
<svg class="ic" viewBox="0 0 64 64"><path class="w1" d="M8 26a34 34 0 0 1 48 0"/><path class="w2" d="M16 35a22 22 0 0 1 32 0"/><path class="w3" d="M25 44a10 10 0 0 1 14 0"/><circle cx="32" cy="52" r="3.5" fill="#D3A667"/></svg>
<h1>النت قاطع شوية</h1>
<p>اتأكد من اتصالك بالإنترنت وارجع جرّب تاني، والتطبيق هيكمل من مكانك.</p>
<button id="r" type="button">حاول تاني</button></div>
<script>
var b=document.getElementById('r');
function go(){b.textContent='جاري المحاولة…';location.href='https://alhuda-ar.github.io/'}
b.onclick=go;window.addEventListener('online',go);
</script></body></html>
