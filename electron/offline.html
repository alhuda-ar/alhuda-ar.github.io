<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>الهدى</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,#1E3E38,#12281f 70%);color:#FAF6EC;font-family:"Segoe UI",Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.c{max-width:380px}.ic{width:100px;height:100px;margin:0 auto 22px;animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.a,.b,.c2{fill:none;stroke:#D3A667;stroke-width:5;stroke-linecap:round;animation:bl 1.8s infinite}
.b{animation-delay:.25s;stroke:#E9C58B}.c2{animation-delay:.5s;stroke:#A9CFC6}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
h1{font-size:24px;margin:0 0 8px}p{margin:0 0 24px;color:#A9CFC6;line-height:1.8}
button{background:linear-gradient(135deg,#E9C58B,#D3A667);color:#12281f;border:0;border-radius:14px;padding:13px 36px;font:700 16px "Segoe UI",Tahoma,sans-serif;cursor:pointer}
button:hover{filter:brightness(1.06)}
</style></head><body><div class="c">
<svg class="ic" viewBox="0 0 64 64"><path class="a" d="M8 26a34 34 0 0 1 48 0"/><path class="b" d="M16 35a22 22 0 0 1 32 0"/><path class="c2" d="M25 44a10 10 0 0 1 14 0"/><circle cx="32" cy="52" r="3.5" fill="#D3A667"/></svg>
<h1>النت قاطع شوية</h1>
<p>اتأكد من اتصالك بالإنترنت، وهنحاول نرجعلك تلقائياً أول ما يرجع.</p>
<button id="r" type="button">حاول تاني</button></div>
<script>
var to=new URLSearchParams(location.search).get('to')||'https://alhuda-ar.github.io';
function go(){document.getElementById('r').textContent='جاري المحاولة…';location.href=to}
document.getElementById('r').onclick=go;window.addEventListener('online',go);setInterval(function(){if(navigator.onLine)go()},8000);
</script></body></html>
