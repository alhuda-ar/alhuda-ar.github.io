name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "اسم الإصدار (مثال 1.0.0)"
        default: "1.0.0"
      version_code:
        description: "رقم الإصدار (لازم يزيد مع كل تحديث)"
        default: "1"
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
      VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - name: التحقق من الأسرار
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KK: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KS KP KA KK; do
            if [ -z "${!v}" ]; then echo "::error::سر ناقص في GitHub Secrets (راجع README)"; exit 1; fi
          done

      - name: تثبيت حزم الموبايل
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: إنشاء مشروع الأندرويد
        working-directory: mobile
        run: npx cap add android

      - name: google-services.json (للإشعارات)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            printf '%s' "$GS" > mobile/android/app/google-services.json
            echo "تمت إضافة google-services.json"
          else
            echo "::warning::GOOGLE_SERVICES_JSON مش موجود، التطبيق هيتبني من غير إشعارات الموبايل"
          fi

      - name: تجهيز المشروع (أيقونات، Manifest، توقيع)
        run: python3 scripts/prepare-android.py --version-code "$VERSION_CODE" --version-name "$VERSION_NAME"

      - name: فك مفتاح التوقيع
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/alhuda.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/alhuda.jks" >> "$GITHUB_ENV"

      - name: بناء الـ APK
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: تسمية الملف
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/Alhuda-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Alhuda-APK
          path: out/*.apk

      - name: نشر في Releases (عند الـ tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
